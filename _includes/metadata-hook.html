{% include schema.html %}

<!-- Site fonts + small enhancements (styles in assets/css/jekyll-theme-chirpy.scss) -->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Inter+Tight:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>

<link rel="preconnect" href="https://umami.ashishghimire.com">
<link rel="preconnect" href="https://pagead2.googlesyndication.com" crossorigin>
<link rel="dns-prefetch" href="//www.googletagmanager.com">
<link rel="dns-prefetch" href="//googleads.g.doubleclick.net">

<!-- umami script now loads natively via _config.yml analytics.umami -->
<script>
  (function () {
    var loaded = false;

    function loadAds() {
      if (loaded) {
        return;
      }

      loaded = true;
      var script = document.createElement('script');
      script.async = true;
      script.crossOrigin = 'anonymous';
      script.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3498505696958660';
      document.head.appendChild(script);
    }

    function scheduleAds() {
      if ('requestIdleCallback' in window) {
        window.requestIdleCallback(loadAds, { timeout: 3500 });
      } else {
        window.setTimeout(loadAds, 2500);
      }
    }

    if (document.readyState === 'complete') {
      scheduleAds();
    } else {
      window.addEventListener('load', scheduleAds, { once: true });
    }
  })();
</script>
