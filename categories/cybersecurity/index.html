<!DOCTYPE html>
<!--
  Redirect for a category archive that no longer exists.

  The taxonomy was consolidated (nine flat categories down to four top-level
  ones with nested leaves), which retires this URL. GitHub Pages cannot serve a
  real 301 for a static path, so this is the same meta-refresh plus canonical
  that jekyll-redirect-from would generate, without the extra dependency.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://ashishghimire.com/categories/security/">
    <meta http-equiv="refresh" content="0; url=https://ashishghimire.com/categories/security/">
    <title>Redirecting to Security</title>
  </head>
  <body>
    <p>This category is now <a href="https://ashishghimire.com/categories/security/">Security</a>.</p>
  </body>
</html>
